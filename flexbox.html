<!DOCTYPE html>
<html lang="pt-br">

</head>

    <main>

        <div id="blocos" class="conteiner">
            <div class="col-70">Bloco 1.0</div>
            <div class="col-30">Bloco 2.0</div>
        </div>

        <div id="bb" class="conteiner">
            <div class="col-30">bb 1</div>
            <div class="col-30">bb 2</div>
            <div class="col-30">bb 3</div>
        </div>
    </main>

    <footer id="rodape" class="conteiner">

        <div class="col-30">bb</div>

</html>
