<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript - Variaveis</title>
</head>
<body>
    

    <script>
        var text = 'Curso de Javascript';
        console.log(text);
        document.write(text);
        alert(text); //Não usar muito, considerado invasivo.

        var numero = 100
        console.log(numero);
        document.write(numero + '<br>');

        let numeroFracao = 100.99;
        console.log(numeroFracao);
        document.write(numeroFracao);

        let teste = true;
        console.log(teste);
        document.write(teste);

        let valorNulo = null;
        console.log(valorNulo);
        document.write(valorNulo);

        let valorNaodefinido = undefined;
        console.log(valorNaodefinido);
        document.write(valorNaodefinido);

        
    </script>
</body>
</html>
