<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript - Concatenação</title>
</head>

<body>

    <script>
        //prompt salva os dados do tipo texto
        let nome = prompt('Digite seu nome'); 
        let idade = prompt("Digite sua idade");
        document.write('ola, ' + nome + ' sua idade é igual: ' + idade);
        
        //Casting: parseInt(), parseIntFloat(), toString()
        let valor1 = '10';
        let converInt = parseInt(valor1);
        console.log(valor1);
        console.log(typeof(valor1));
        console.log(converInt);
        console.log(typeof(converInt));

        let teste = parseFloat(prompt('Digite sua nota'));
        document.write(teste);
        console.log(teste);
        console.log(typeof(teste));

    </script>
</body>
</html>
